# exact version で pin し、latest にしない (Renovate が mise.lock と合わせて更新する)。
[tools]
prek = "0.5.10"
jactionlint = "2.6.0"
dprint = "0.64.3"
fnox = "v1.48.0"
gitleaks = "8.30.1"
typos = "1.52.2"
zizmor = "1.32.0"
# jactionlint は PATH の shellcheck で run: を検査するため、ローカルと CI で揃えて pin する
shellcheck = "0.11.0"
# release タスクが tag と GitHub Release を作るのに使う
gh = "2.104.0"

[env]
# ローカルだけの値は mise.local.toml で上書きする (.gitignore により追跡されない)。
# 例:
# MY_VAR = "value"
# _.file = ".env"

[tasks.pre-commit]
description = "全ファイルに pre-commit の hook を実行する (CI の prek job のうち online の検査を除く部分)"
# no-commit-to-branch は検証ではないので、main を checkout したままでも検証できるよう外す。
# SKIP= の環境変数ではなく option で外すのは、Windows の cmd で動かないため
run = "prek run --all-files --skip no-commit-to-branch"

[tasks.docs]
description = "README.md のタスク一覧を mise.toml から生成し直す"
run = "mise generate task-docs --inject --output README.md"

[tasks.template-diff]
description = "共通ファイルを dope-corp/template の main と比べて差分を表示する"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo="dope-corp/template"
# 比べる対象は template の main にあるファイル。README.md / CODEOWNERS / mise.lock はリポジトリごとに書き換えるので比べない
# 一覧と内容を同じ版で比べ、パスを URL に埋め込まないよう、内容は blob の SHA で取得する
entries="$(gh api "repos/${repo}/git/trees/main?recursive=1" \
  --jq '.tree[] | select(.type == "blob") | select(.path != "README.md" and .path != ".github/CODEOWNERS" and .path != "mise.lock") | "\(.sha)\t\(.path)"')"
upstream="$(mktemp)"
trap 'rm -f "${upstream}"' EXIT
failed=0
while IFS=$'\t' read -r sha f; do
  if [[ ! -f "${f}" ]]; then
    echo "!! ${f}: missing locally"
    continue
  fi
  # 取得できないファイルは比べられていないので、最後に失敗にする
  if ! gh api "repos/${repo}/git/blobs/${sha}" -H 'Accept: application/vnd.github.raw+json' > "${upstream}"; then
    echo "!! ${f}: fetch failed" >&2
    failed=1
    continue
  fi
  diff -u --label "template/${f}" --label "${f}" "${upstream}" "${f}" || true
done <<< "${entries}"
exit "${failed}"
'''

# GITHUB_TOKEN は workflows 権限を持てず、workflow ファイルを変えた commit への tag の作成を拒否されることがあるので、
# CI ではなく手元の gh の認証 (workflow scope を含む) で作る
[tasks.release]
description = "preset と reusable workflow の変更を merge した後に、main に次の版の tag と GitHub Release を作る"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo="dope-corp/.github"
head="origin/main"
# 利用側が版を固定して参照するファイル
paths=(renovate-preset.json '.github/workflows/reusable-*.yaml')
git fetch --quiet --tags origin main
last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${head}" 2>/dev/null || true)"
if [[ -z "${last}" ]]; then
  next="v1.0.0"
elif git diff --quiet "${last}" "${head}" -- "${paths[@]}"; then
  # 利用側に届くファイルが変わらない版で、全リポジトリに Renovate の更新 PR を作らない
  echo "No change to the preset or reusable workflows since ${last}; nothing to release"
  exit 0
else
  # 前の tag 以降の commit のうち、利用側のファイルを変えたものの一番大きい変更で版を上げる
  breaking_re='^[a-z]+(\([^)]*\))?!:'
  feat_re='^feat(\([^)]*\))?:'
  bump="patch"
  shas="$(git log --format=%H "${last}..${head}" -- "${paths[@]}")"
  while read -r sha; do
    subject="$(git log -1 --format=%s "${sha}")"
    body="$(git log -1 --format=%b "${sha}")"
    if [[ "${subject}" =~ ${breaking_re} ]] || grep -q '^BREAKING[ -]CHANGE:' <<< "${body}"; then
      bump="major"
      break
    elif [[ "${subject}" =~ ${feat_re} ]]; then
      bump="minor"
    fi
  done <<< "${shas}"
  IFS=. read -r major minor patch <<< "${last#v}"
  case "${bump}" in
    major) next="v$((major + 1)).0.0" ;;
    minor) next="v${major}.$((minor + 1)).0" ;;
    *) next="v${major}.${minor}.$((patch + 1))" ;;
  esac
fi
target="$(git rev-parse "${head}")"
echo "${last:-"(no release yet)"} -> ${next}"
git log --oneline "${last:+${last}..}${head}" -- "${paths[@]}"
read -r -p "Create ${next} at ${target}? [y/N] " answer
if [[ "${answer}" != "y" ]]; then
  echo "Aborted" >&2
  exit 1
fi
gh release create "${next}" --repo "${repo}" --target "${target}" --generate-notes
'''

[hooks]
postinstall = "prek install"

[settings]
lockfile = true

# 手元でも CI の --locked と同じく mise.lock に無い版を拒否する。[settings] の locked はユーザーのグローバルな
# tool にも効くので、このリポジトリの tool だけに効く tool_config に置く
[tool_config]
locked = true
