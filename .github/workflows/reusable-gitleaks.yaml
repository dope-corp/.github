name: gitleaks (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: job の runs-on に渡す値を JSON で書く (例 "ubuntu-latest"、["self-hosted", "Linux", "X64"])
        type: string
        default: '"ubuntu-latest"'
      mise-version:
        description: mise 本体の版。空なら mise-action が最新版を入れる
        type: string
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: gitleaks
    permissions:
      contents: read
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 履歴全体をスキャンするため
          fetch-depth: 0
          persist-credentials: false

      # 呼び出し元の org の Actions 許可設定で jdx/mise-action@* を許可している必要がある
      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ inputs.mise-version }}
          install_args: gitleaks

      # ツールを指定しない mise exec は mise.toml の全ツールを解決しようとするので、gitleaks に限る
      - name: Run gitleaks
        run: mise exec gitleaks -- gitleaks git --redact -v .
