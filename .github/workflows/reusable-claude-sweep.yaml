name: Claude Sweep (reusable)

# 呼び出し元の job は contents: read・actions: read・issues: write を許可する。
# 呼び出し元の mise.toml で gh の版を固定する (mise.lock も要る)。
# 呼び出し元の workflow を週次の schedule で起動し、同じ workflow の前回成功した run の commit から HEAD までをレビューする
on:
  workflow_call:
    inputs:
      runs-on:
        description: job の runs-on に渡す値を JSON で書く (例 "ubuntu-latest"、["self-hosted", "Linux", "X64"])
        type: string
        default: '"ubuntu-latest"'
      mise-version:
        description: mise 本体の版。空なら、runner に残った版か、mise-action が選ぶ公開から 24 時間たった最新版を使う
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: claude setup-token で発行した token
        required: true

permissions: {}

defaults:
  run:
    shell: bash

# レビューの起点を tag で持たないのは、GITHUB_TOKEN が workflow ファイルの変更を含む commit へ ref を動かせず、
# push が拒否されることがあるため。
# review job には Claude の OAuth credential と issues: read の token が残るため、prompt injection による
# credential の露出は --allowedTools で Bash を絞って緩和するだけにとどまる。issue を書ける token は、
# Claude を動かさない file job だけが持つ。
jobs:
  plan:
    name: plan
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read # checkout するため
      actions: read # 前回成功した run を gh run list で引くため
    env:
      # mise の shim が mise.toml の他のツールを解決・インストールしないよう、gh に限る
      MISE_ENABLE_TOOLS: gh
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 差分計算に全履歴が要る
          fetch-depth: 0
          persist-credentials: false

      # runner の gh ではなく、呼び出し元の mise.toml で固定した gh を使う (self-hosted runner には gh が無いことがある)。
      # 呼び出し元の org の Actions 許可設定で jdx/mise-action@* を許可している必要がある
      - name: Install gh
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ inputs.mise-version }}
          # cache は mise の全ツールを save / restore するので、gh だけを入れる job では使わない
          cache: false
          install_args: gh

      - name: Determine review range
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # 手動実行で別のブランチや tag を選ぶと、main に入っていない変更をレビューして起票してしまう
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "default branch (${DEFAULT_BRANCH}) 以外では実行しない: ${GITHUB_REF}"
            exit 0
          fi
          # 呼び出し元の workflow のファイル名 (github context は呼び出し元を指す)。ブランチ名に @ が入りうるので @refs/ で切る
          workflow="${GITHUB_WORKFLOW_REF%%@refs/*}"
          workflow="${workflow##*/}"
          head="$(git rev-parse HEAD)"
          echo "head=${head}" >> "${GITHUB_OUTPUT}"
          # review が失敗した run は起点にならず、次回に同じ範囲を再レビューする
          base="$(gh run list --workflow "${workflow}" --branch "${DEFAULT_BRANCH}" --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [[ -z "${base}" ]]; then
            # 初回は全体のレビューが大きすぎるため、成功で終えて起点を作るだけにする
            echo "成功した run が無いため bootstrap する (レビューは次回から)"
            exit 0
          fi
          # default branch の履歴が書き換えられると、base が head の祖先でなくなる (checkout にも無いことがある)。
          # 書き換えの前と共通の commit からレビューし直す。base は checkout に無くても GitHub に残っていることがあるので、
          # 共通祖先は compare API で求める。範囲を決められないときは warning を出して bootstrap し直す。
          # job を失敗させる (次回に同じ base でやり直す) のは、再試行で直りうる 5xx と rate limit (429) だけにする。
          # ほかで失敗させると、同じ base で毎回失敗し続ける
          if ! git merge-base --is-ancestor "${base}" "${head}" 2>/dev/null; then
            err="$(mktemp)"
            if merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${base}...${head}" --jq '.merge_base_commit.sha // empty' 2> "${err}")"; then
              if [[ -z "${merge_base}" ]] || ! git merge-base --is-ancestor "${merge_base}" "${head}" 2>/dev/null; then
                echo "::warning::前回レビューした commit ${base} と ${head} の共通祖先が見つからないため、bootstrap し直す (${base}..${head} はレビューしない)"
                exit 0
              fi
              echo "::warning::前回レビューした commit ${base} が ${head} の祖先でないため、共通祖先 ${merge_base} からレビューする"
              base="${merge_base}"
            elif grep -qE '\(HTTP (5[0-9]{2}|429)\)' "${err}"; then
              cat "${err}" >&2
              exit 1
            else
              cat "${err}" >&2
              echo "::warning::前回レビューした commit ${base} と ${head} を比較できないため、bootstrap し直す (${base}..${head} はレビューしない)"
              exit 0
            fi
          fi
          # git diff --quiet は差分ありで 1、エラーで 128 を返すので、1 のときだけレビューする
          status=0
          git diff --quiet "${base}..${head}" || status=$?
          case "${status}" in
            0)
              # 差分が無ければ Claude を起動しない (費用を抑えるため)
              echo "前回レビュー以降の差分が無いためスキップする"
              ;;
            1)
              echo "mode=review" >> "${GITHUB_OUTPUT}"
              echo "base=${base}" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              exit "${status}"
              ;;
          esac

  review:
    name: review
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'review' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: read # checkout と差分の取得のため
      issues: read # 過去の指摘と重複しないよう、既存の issue を読むため
    env:
      # mise の shim が mise.toml の他のツールを解決・インストールしないよう、gh に限る
      MISE_ENABLE_TOOLS: gh
    outputs:
      findings: ${{ steps.sweep.outputs.structured_output }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # runner の gh ではなく、呼び出し元の mise.toml で固定した gh を使う (self-hosted runner には gh が無いことがある)。
      # 呼び出し元の org の Actions 許可設定で jdx/mise-action@* を許可している必要がある
      - name: Install gh
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ inputs.mise-version }}
          # cache は mise の全ツールを save / restore するので、gh だけを入れる job では使わない
          cache: false
          install_args: gh

      - name: Run Claude Code sweep
        id: sweep
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        env:
          # Claude が Bash から gh CLI を使うため
          GH_TOKEN: ${{ github.token }}
        with:
          # environment に移さない。Free plan の private リポジトリでは environment を使えず、public リポジトリで
          # required reviewers を付けると週次の sweep のたびに承認が要るため
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]
          # 未指定だと action は OIDC で Claude GitHub App の token を取得し、job の permissions に
          # 縛られない。github.token を渡して job の権限に閉じる
          github_token: ${{ github.token }}
          # default は --allowedTools に無い操作を拒否する (承認する人がいないため)。既定の auto mode では、
          # 安全性の判定を通れば列挙していない操作も実行される。
          # 指摘は --json-schema の structured output で返させ、起票は file job が行う。Claude Code は
          # 改行の後に # が続く引数 (Markdown の見出しを含む本文) を拒否するので、Claude には起票させられない。
          # git grep は -O (--open-files-in-pager) で任意のコマンドを実行できるので許可しない (検索は Grep ツールで行う)。
          # model を指定するのは、既定の model では数 turn で終わり、数十 commit の範囲を読み切らないため
          claude_args: |
            --model opus
            --permission-mode default
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh search issues:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["findings"],"properties":{"findings":{"type":"array","maxItems":50,"items":{"type":"object","additionalProperties":false,"required":["title","body"],"properties":{"title":{"type":"string","minLength":1,"description":"issue のタイトル"},"body":{"type":"string","minLength":1,"description":"issue の本文 (Markdown)"}}}}}}'
          prompt: |
            このリポジトリの定期レビュー sweep を実行してください。

            リポジトリ: ${{ github.server_url }}/${{ github.repository }}
            対象範囲: ${{ needs.plan.outputs.base }}..${{ needs.plan.outputs.head }}
            リポジトリの公開範囲: ${{ github.event.repository.private && 'private' || 'public' }}

            使えるのは、ファイルを読み検索するツールと、git diff・git log・git show、gh issue list・gh issue view・
            gh search issues だけ。ほかのコマンド (別のリポジトリの tag や release を引く gh api・git ls-remote 等) は拒否される。
            許可されていないコマンドを含む複合コマンドは全体が拒否されるので、コマンドは 1 つずつ実行する。
            リポジトリの外の事実を確かめられないときは、確かめられなかったことを指摘の confidence と本文に書く。

            手順:
            1. `git log --oneline <base>..<head>` と `git diff --name-status <base>..<head>` で、変更された commit とファイルを把握する。
            2. 変更されたファイルをすべてレビューする。lock file と生成物を除く各ファイルの差分を
               `git diff <base>..<head> -- <path>` で読み、要るなら周辺のコードも読む。観点は次のとおり:
               - correctness: バグ、エッジケースの見落とし、エラーハンドリングの欠落、レグレッション
               - security: 入力検証、認証・認可、secret の扱い、危険なコマンド実行
               - simplification: コードの重複、既存ユーティリティの再利用漏れ、不要な複雑さ、非効率な実装
            3. `gh issue list --label claude-sweep --state all --limit 1000` で過去の指摘を全件確認し、
               同一の問題 (同じ箇所・同じ趣旨) は指摘に含めない。close 済みのものも含めない。
            4. 新規の指摘を 1 指摘 = 1 件として findings に入れる。issue は workflow が findings から起票するので、
               自分では起票しない。指摘が無ければ findings を空にする。findings は 50 件までで、超えるときは
               severity の高い順に 50 件を選ぶ。各 body には次を含める:
               - 対象箇所 (file:line と permalink。permalink は `<リポジトリ>/blob/<head>/<path>#L<line>` で、
                 削除されたファイルや行を指すときは `<base>` と変更前のパス・行番号を使う)
               - 問題の説明と、そう判断した根拠
               - 推奨する修正方針
               - severity (high/medium/low) と confidence (high/medium/low)
            5. 公開範囲が public のときは、悪用できる脆弱性 (security の観点の指摘のうち、攻撃に使えるもの) の
               対象箇所・内容・根拠・修正方針を、findings にもほかの出力にも書かない。issue と Actions のログは
               誰でも見られるため。代わりに「非公開で確認が必要なセキュリティ上の指摘がある」とだけ、
               対象範囲を添えて 1 件入れる。
            6. コードは変更しない。

  collect:
    name: collect
    needs: review
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions: {}
    outputs:
      exists: ${{ steps.collect.outputs.exists }}
    steps:
      # review の structured output が無いとき (GitHub は secret を含むと判定した job output を渡さない) に、
      # 指摘を落としたまま run を成功させない。成功した run だけが次回の起点になるので、同じ範囲を次回に再レビューする。
      # job の if で fromJSON の評価が失敗しても run が失敗になるとは限らないため、step で確かめる
      - name: Check findings
        id: collect
        env:
          FINDINGS: ${{ needs.review.outputs.findings }}
        run: |
          if [[ -z "${FINDINGS}" ]]; then
            echo "::error::review job did not return structured output"
            exit 1
          fi
          if [[ "${FINDINGS}" =~ ^\{[[:space:]]*\"findings\"[[:space:]]*:[[:space:]]*\[[[:space:]]*\][[:space:]]*\}$ ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          fi

  file:
    name: file
    needs: [review, collect]
    if: ${{ needs.collect.outputs.exists == 'true' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read # mise.toml を読むため
      issues: write # 指摘を issue に起票するため
    env:
      MISE_ENABLE_TOOLS: gh
    # matrix は 256 job までなので、review の --json-schema で指摘を 50 件までに制限している。
    # 指摘を shell で JSON として分けない (self-hosted runner に jq が無いことがある)。label の作成が重ならないよう
    # 1 件ずつ起票し、1 件の失敗で残りを取り消さない (失敗した run は次回に同じ範囲を再レビューする)
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        finding: ${{ fromJSON(needs.review.outputs.findings).findings }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: ${{ inputs.mise-version }}
          cache: false
          install_args: gh

      - name: File the finding as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ matrix.finding.title }}
          BODY: ${{ matrix.finding.body }}
        run: |
          labels="$(gh label list --repo "${GITHUB_REPOSITORY}" --limit 1000 --json name --jq '.[].name')"
          if ! grep -qx claude-sweep <<< "${labels}"; then
            gh label create claude-sweep --repo "${GITHUB_REPOSITORY}" --description "Claude weekly sweep findings" --color 5319E7
          fi
          # 起票した後に job が失敗して再実行されても、同じ指摘を重ねて起票しない
          titles="$(gh issue list --repo "${GITHUB_REPOSITORY}" --label claude-sweep --state all --limit 1000 --json title --jq '.[].title')"
          if grep -Fqx -- "${TITLE}" <<< "${titles}"; then
            echo "同じタイトルの issue があるため起票しない"
            exit 0
          fi
          printf '%s\n' "${BODY}" | gh issue create --repo "${GITHUB_REPOSITORY}" --label claude-sweep --title "${TITLE}" --body-file -
